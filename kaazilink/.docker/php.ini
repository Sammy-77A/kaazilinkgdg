; ─────────────────────────────────────────────────────────────────────────────
; Kaazilink — PHP runtime configuration for Render.com (Alpine + PHP-FPM)
; ─────────────────────────────────────────────────────────────────────────────

; ── Temp file handling ────────────────────────────────────────────────────────
; Use the OS /tmp directory for ALL temporary files.
; /tmp is ALWAYS writable in any Linux container (Docker, Render, etc.).
; This fixes: stream_get_meta_data(): Argument #1 ($stream) must be of type
; resource, false given — caused when tmpfile() can't write to the temp dir.
upload_tmp_dir = /tmp
sys_temp_dir   = /tmp

; ── File upload limits ────────────────────────────────────────────────────────
; KYC documents (ID front/back, KRA PIN) can be up to 5MB each.
; Set post_max_size higher than upload_max_filesize to allow multi-file uploads.
upload_max_filesize = 10M
post_max_size       = 32M

; ── Execution limits ──────────────────────────────────────────────────────────
max_execution_time  = 60
max_input_time      = 60
memory_limit        = 256M

; ── Error handling (production) ───────────────────────────────────────────────
display_errors    = Off
log_errors        = On
error_log         = /dev/stderr
